          <h2>나의 쇼핑 정보</h2>

          <nav aria-label="마이페이지 메뉴">
            <a href="#orders">주문 내역 조회</a>

            <a class="ghost-button" href="#inquiry">1:1 문의하기</a>
          </nav>
        </aside>

        <section class="recent-list" data-recent-list aria-label="최근 본 상품 목록">
          <h1>최근 본 상품</h1>

          <article class="recent-item">
            <a class="recent-item__image" href="./product-detail.html">
              <img src="./img/main_best_item_img/main_best_item_img_4.jpg" alt="포레스트 데이 코튼 롬퍼" />
            </a>

            <div class="recent-item__content">
              <button class="recent-delete" type="button" data-recent-delete aria-label="상품 삭제">×</button>

              <h2>
                <a href="./product-detail.html">포레스트 데이 코튼 롬퍼</a>
              </h2>

              <span class="recent-item__price" aria-label="상품 가격 정보">
                <ul>
                  <li><del>39,000원</del></li>
                  <li>31,200원</li>
                </ul>
              </span>

              <p class="recent-item__point"><img src="./img/icon/icon_clarity_won_solid.svg" alt="원 아이콘" class="icon-won" /><span>300원</span></p>

              <div class="recent-actions">
                <button class="secondary-button" type="button" data-demo-action>장바구니</button>
                <a class="primary-button" href="./product-detail.html">주문하기</a>
              </div>

              <div class="recent-options">
                <label>사이즈</label>
                <select>
                  <option>-[필수] 옵션을 선택해 주세요-</option>
                  <option>80</option>
                  <option>90</option>
                  <option>100</option>

                  <option>-[필수] 옵션을 선택해 주세요-</option>
                  <option>세이지</option>
                  <option>크림</option>
                </select>
              </div>
            </div>
          </article>

          <article class="recent-item">
            <a class="recent-item__image" href="./product-detail.html">
              <img src="./img/kidswear_img/kidswear15_lavender_sweat_set.jpg" alt="밀크티 컴포트 상하복 세트" />

                  <option>오트밀</option>
                  <option>라벤더</option>
                </select>

          <article class="recent-item">
            <a class="recent-item__image" href="./product-detail.html">

            </a>

            <div class="recent-item__content">
              <button class="recent-delete" type="button" data-recent-delete aria-label="상품 삭제">×</button>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="멜로위 회원 로그인" />
    <title>로그인 | MELLOWEE</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/header.css" />
    <link rel="stylesheet" href="./css/footer.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/pages.css" />
    <link rel="stylesheet" href="./css/login.css" />
    <link rel="stylesheet" href="./css/font.css">
    <script src="./js/components.js" defer></script>
    <script src="./js/pages.js" defer></script>
    <script src="./js/header.js" defer></script>
</head>
  <body class="subpage">
    <div data-site-header></div>
    <main class="login-page">
      <section class="login-box" aria-labelledby="login-title">
        <h1 id="login-title">로그인</h1>
        <form class="login-form" data-login-form novalidate>
          <label class="sr-only" for="user-id">아이디</label>
          <input id="user-id" name="userId" type="text" autocomplete="username" placeholder="아이디" />
          <label class="sr-only" for="user-password">비밀번호</label>
          <input id="user-password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호" />
          <div class="login-options"><label><input type="checkbox" /> 아이디 저장</label><label><input type="checkbox" checked /> 보안접속</label></div>
          <button class="primary-button" type="submit">로그인</button>
          <p class="form-message" data-form-message aria-live="polite"></p>
        </form>
        <div class="login-links"><a href="#find-id">아이디 찾기</a><a href="#find-password">비밀번호 찾기</a></div>
        <section class="join-card" id="signup"><h2>아직 회원이 아니신가요?</h2><p>지금 회원가입을 하시면<br />다양하고 특별한 혜택이 준비되어 있습니다.</p><a class="secondary-button" href="#join">회원가입</a></section>
        <p class="sns-title">SNS 로그인</p>
        <div class="sns-buttons">
          <button class="sns-button sns-button--kakao" type="button">
            <img src="./img/icon/icon_kakao_yellow_pc.svg" alt="카카오톡 아이콘" class="sns-icon" />카카오 로그인
          </button>
          <button class="sns-button sns-button--naver" type="button">
            <img src="./img/icon/icon_naver_pc.svg" alt="네이버 아이콘" class="sns-icon" />네이버 로그인
          </button>
        </div>
      </section>
    </main>
    <div data-site-footer></div>
  </body>
</html>
